<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - ROS App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "background": "#f5fbf5",
                        "outline": "#6f7974",
                        "on-primary": "#ffffff",
                        "primary-container": "#156b54",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#3f4944",
                        "on-secondary-fixed": "#00210d",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#88d6b9",
                        "on-primary-fixed": "#002117",
                        "surface-tint": "#156b54",
                        "tertiary-container": "#885200",
                        "surface-dim": "#d5dcd6",
                        "primary-fixed": "#a4f2d5",
                        "surface-bright": "#f5fbf5",
                        "surface": "#f5fbf5",
                        "tertiary": "#673d00",
                        "on-surface": "#171d1a",
                        "on-secondary-container": "#237242",
                        "on-secondary-fixed-variant": "#00522a",
                        "secondary-container": "#a4f4b8",
                        "on-primary-container": "#9ae9cb",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#00513e",
                        "surface-container-highest": "#dee4df",
                        "on-background": "#171d1a",
                        "tertiary-fixed": "#ffdcbb",
                        "inverse-on-surface": "#ecf2ed",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#dee4df",
                        "tertiary-fixed-dim": "#ffb869",
                        "on-tertiary-container": "#ffd0a0",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#673d00",
                        "secondary-fixed-dim": "#89d89e",
                        "secondary": "#1b6c3d",
                        "secondary-fixed": "#a4f4b8",
                        "inverse-surface": "#2c322e",
                        "inverse-primary": "#88d6b9",
                        "surface-container": "#e9efea",
                        "on-primary-fixed-variant": "#00513e",
                        "surface-container-low": "#eff5f0",
                        "outline-variant": "#bec9c3",
                        "on-tertiary-fixed": "#2b1700",
                        "surface-container-high": "#e4eae4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "input": "8px"
                    },
                    "spacing": {
                        "bottom-action-height": "56px",
                        "touch-target-min": "48px",
                        "gutter": "16px",
                        "margin-page": "16px"
                    },
                    "fontFamily": {
                        "body-main": ["Roboto"],
                        "label-caption": ["Roboto"],
                        "display-title": ["Roboto"],
                        "body-secondary": ["Roboto"],
                        "section-header": ["Roboto"],
                        "money-display": ["Roboto"]
                    },
                    "fontSize": {
                        "body-main": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caption": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "display-title": ["24px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "body-secondary": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "section-header": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "money-display": ["16px", { "lineHeight": "24px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center font-body-main text-on-background p-margin-page">
<main class="w-full max-w-md bg-surface p-8 rounded-xl flex flex-col items-center">
<div class="mb-8 flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-5xl mb-4" style="font-variation-settings: 'FILL' 1;">
                account_circle
            </span>
<h1 class="font-display-title text-display-title text-on-surface">Create an account</h1>
</div>
<form class="w-full flex flex-col gap-4">
<div class="relative w-full">
<input class="peer w-full h-[56px] px-4 border border-outline rounded-input bg-transparent text-body-main text-on-surface focus:outline-none focus:border-2 focus:border-primary placeholder-transparent transition-all" id="name" placeholder="Name" required="" type="text"/>
<label class="absolute left-4 top-4 text-body-secondary text-on-surface-variant transition-all peer-focus:-top-2 peer-focus:text-xs peer-focus:text-primary peer-focus:bg-surface peer-focus:px-1 peer-valid:-top-2 peer-valid:text-xs peer-valid:bg-surface peer-valid:px-1 cursor-text" for="name">
                    Name
                </label>
</div>
<div class="relative w-full">
<input class="peer w-full h-[56px] px-4 border border-outline rounded-input bg-transparent text-body-main text-on-surface focus:outline-none focus:border-2 focus:border-primary placeholder-transparent transition-all" id="email" placeholder="Email" required="" type="email"/>
<label class="absolute left-4 top-4 text-body-secondary text-on-surface-variant transition-all peer-focus:-top-2 peer-focus:text-xs peer-focus:text-primary peer-focus:bg-surface peer-focus:px-1 peer-valid:-top-2 peer-valid:text-xs peer-valid:bg-surface peer-valid:px-1 cursor-text" for="email">
                    Email
                </label>
</div>
<div class="relative w-full">
<input class="peer w-full h-[56px] px-4 border border-outline rounded-input bg-transparent text-body-main text-on-surface focus:outline-none focus:border-2 focus:border-primary placeholder-transparent transition-all" id="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-4 top-4 text-body-secondary text-on-surface-variant transition-all peer-focus:-top-2 peer-focus:text-xs peer-focus:text-primary peer-focus:bg-surface peer-focus:px-1 peer-valid:-top-2 peer-valid:text-xs peer-valid:bg-surface peer-valid:px-1 cursor-text" for="password">
                    Password
                </label>
</div>
<button class="w-full h-[56px] bg-primary text-on-primary rounded-input font-section-header text-section-header mt-4 active:bg-primary/90 flex items-center justify-center transition-colors" type="submit">
                Create account
            </button>
</form>
<div class="mt-8 text-center">
<p class="font-body-secondary text-body-secondary text-on-surface-variant mb-2">Already have an account?</p>
<button class="font-section-header text-section-header text-primary h-touch-target-min px-4 rounded-input active:bg-primary/10 transition-colors">
                Sign in
            </button>
</div>
</main>
</body></html>
