<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuickServe POS - Open Tables</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#9ae9cb",
                    "primary-fixed-dim": "#88d6b9",
                    "surface-container-low": "#eff5f0",
                    "surface-bright": "#f5fbf5",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#dee4df",
                    "secondary": "#1b6c3d",
                    "on-error-container": "#93000a",
                    "outline": "#6f7974",
                    "surface-variant": "#dee4df",
                    "on-tertiary-container": "#ffd0a0",
                    "surface-dim": "#d5dcd6",
                    "on-secondary-fixed": "#00210d",
                    "on-surface-variant": "#3f4944",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-background": "#171d1a",
                    "surface-container": "#e9efea",
                    "inverse-surface": "#2c322e",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#ecf2ed",
                    "on-secondary-container": "#237242",
                    "secondary-fixed-dim": "#89d89e",
                    "on-primary-fixed": "#002117",
                    "tertiary-fixed-dim": "#ffb869",
                    "primary": "#00513e",
                    "outline-variant": "#bec9c3",
                    "secondary-container": "#a4f4b8",
                    "tertiary-fixed": "#ffdcbb",
                    "surface-container-high": "#e4eae4",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#673d00",
                    "tertiary-container": "#885200",
                    "surface": "#f5fbf5",
                    "on-tertiary-fixed": "#2b1700",
                    "primary-fixed": "#a4f2d5",
                    "background": "#f5fbf5",
                    "inverse-primary": "#88d6b9",
                    "on-primary-fixed-variant": "#00513e",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed-variant": "#00522a",
                    "tertiary": "#673d00",
                    "on-surface": "#171d1a",
                    "secondary-fixed": "#a4f4b8",
                    "primary-container": "#156b54",
                    "error": "#ba1a1a",
                    "surface-tint": "#156b54"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "bottom-action-height": "56px",
                    "margin-page": "16px",
                    "gutter": "16px",
                    "touch-target-min": "48px"
            },
            "fontFamily": {
                    "body-secondary": ["Roboto"],
                    "display-title": ["Roboto"],
                    "section-header": ["Roboto"],
                    "label-caption": ["Roboto"],
                    "body-main": ["Roboto"],
                    "money-display": ["Roboto"]
            },
            "fontSize": {
                    "body-secondary": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-title": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],
                    "section-header": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "label-caption": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "body-main": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "money-display": ["16px", {"lineHeight": "24px", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased pt-14 pb-bottom-action-height min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim bg-surface-container dark:bg-surface-container-highest flat no shadows flex items-center justify-between px-gutter h-14 w-full">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 dark:hover:bg-primary-fixed/10 transition-colors duration-200 text-on-surface-variant dark:text-outline-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">storefront</span>
</button>
<h1 class="font-display-title text-display-title font-bold text-primary dark:text-primary-fixed-dim m-0 leading-none">QuickServe POS</h1>
</div>
<button aria-label="Profile" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 dark:hover:bg-primary-fixed/10 transition-colors duration-200 text-on-surface-variant dark:text-outline-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-gutter relative z-0">
<div class="mb-6 flex justify-between items-end">
<div>
<h2 class="font-section-header text-section-header text-on-surface">Open Tables</h2>
<p class="font-body-secondary text-body-secondary text-on-surface-variant">Active dining sessions</p>
</div>
<button class="bg-primary text-on-primary font-section-header text-section-header px-4 py-2 rounded flex items-center gap-2 h-12 shadow-sm active:bg-primary/90 transition-colors">
<span class="material-symbols-outlined">add</span> New Order
            </button>
</div>
<!-- Empty State (Hidden by default, shown for demonstration if grid was empty) -->
<!-- <div class="flex flex-col items-center justify-center h-64 text-center mt-12 bg-surface-container rounded-xl p-8 border border-outline-variant border-dashed">
            <span class="material-symbols-outlined text-4xl text-outline mb-4 opacity-50">table_restaurant</span>
            <p class="font-body-main text-body-main text-on-surface-variant max-w-md">No open tables. Start an order with a table label to open one.</p>
        </div> -->
<!-- Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
<!-- Card 1 -->
<button class="bg-surface-container rounded-xl p-4 flex flex-col justify-between aspect-square active:bg-surface-container/80 transition-colors relative overflow-hidden group border border-transparent hover:border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-[0.08] transition-opacity"></div>
<div class="flex justify-between items-start w-full">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-bright text-primary shadow-sm">
<span class="material-symbols-outlined text-sm">person</span>
<span class="font-label-caption text-label-caption ml-1">4</span>
</span>
<!-- Status indicator -->
<span class="w-3 h-3 rounded-full bg-[#FFF0D4] border border-[#8A5300] shadow-sm"></span>
</div>
<div class="flex flex-col items-center justify-center flex-grow">
<h3 class="font-display-title text-display-title text-on-surface font-bold text-3xl">T4</h3>
<p class="font-body-secondary text-body-secondary text-on-surface-variant mt-1">Table 4</p>
</div>
<div class="flex justify-between items-end w-full border-t border-outline-variant/30 pt-3 mt-2">
<span class="font-label-caption text-label-caption text-on-surface-variant bg-surface-container-highest px-2 py-1 rounded">3 Items</span>
<span class="font-money-display text-money-display text-on-surface tabular-nums">₹1,240</span>
</div>
</button>
<!-- Card 2 -->
<button class="bg-surface-container rounded-xl p-4 flex flex-col justify-between aspect-square active:bg-surface-container/80 transition-colors relative overflow-hidden group border border-transparent hover:border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-[0.08] transition-opacity"></div>
<div class="flex justify-between items-start w-full">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-bright text-primary shadow-sm">
<span class="material-symbols-outlined text-sm">person</span>
<span class="font-label-caption text-label-caption ml-1">2</span>
</span>
<!-- Status indicator - Ready/Paid style -->
<span class="w-3 h-3 rounded-full bg-secondary border border-secondary shadow-sm"></span>
</div>
<div class="flex flex-col items-center justify-center flex-grow">
<h3 class="font-display-title text-display-title text-on-surface font-bold text-3xl">T12</h3>
<p class="font-body-secondary text-body-secondary text-on-surface-variant mt-1">Table 12</p>
</div>
<div class="flex justify-between items-end w-full border-t border-outline-variant/30 pt-3 mt-2">
<span class="font-label-caption text-label-caption text-on-surface-variant bg-surface-container-highest px-2 py-1 rounded">5 Items</span>
<span class="font-money-display text-money-display text-on-surface tabular-nums">₹3,850</span>
</div>
</button>
<!-- Card 3 -->
<button class="bg-surface-container rounded-xl p-4 flex flex-col justify-between aspect-square active:bg-surface-container/80 transition-colors relative overflow-hidden group border border-transparent hover:border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-[0.08] transition-opacity"></div>
<div class="flex justify-between items-start w-full">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-bright text-primary shadow-sm">
<span class="material-symbols-outlined text-sm">person</span>
<span class="font-label-caption text-label-caption ml-1">6</span>
</span>
<!-- Status indicator -->
<span class="w-3 h-3 rounded-full bg-[#FFF0D4] border border-[#8A5300] shadow-sm"></span>
</div>
<div class="flex flex-col items-center justify-center flex-grow">
<h3 class="font-display-title text-display-title text-on-surface font-bold text-3xl">T8</h3>
<p class="font-body-secondary text-body-secondary text-on-surface-variant mt-1">Table 8</p>
</div>
<div class="flex justify-between items-end w-full border-t border-outline-variant/30 pt-3 mt-2">
<span class="font-label-caption text-label-caption text-on-surface-variant bg-surface-container-highest px-2 py-1 rounded">12 Items</span>
<span class="font-money-display text-money-display text-on-surface tabular-nums">₹8,920</span>
</div>
</button>
<!-- Card 4 - Empty/Reserved state example -->
<button class="bg-surface-container-low border border-dashed border-outline-variant rounded-xl p-4 flex flex-col justify-center items-center aspect-square active:bg-surface-container/80 transition-colors focus:outline-none focus:ring-2 focus:ring-primary group opacity-70 hover:opacity-100">
<span class="material-symbols-outlined text-4xl text-outline mb-2 group-hover:text-primary transition-colors">add_circle</span>
<span class="font-section-header text-section-header text-on-surface-variant group-hover:text-primary transition-colors">Open New</span>
</button>
</div>
</main>
<!-- BottomNavBar (Visible on mobile md:hidden, usually you'd hide this on desktop but instructions say responsive pivot) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 h-bottom-action-height bg-surface dark:bg-surface-dim bg-surface-container dark:bg-surface-container-highest flat no shadows flex justify-around items-center w-full">
<!-- Assuming "Orders" is active based on context of Open Tables -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-on-surface-variant/5 active:scale-95 transition-transform w-16 h-full">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">point_of_sale</span>
<span class="font-label-caption text-label-caption">Register</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-5 py-1 active:scale-95 transition-transform h-12">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label-caption text-label-caption">Orders</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-on-surface-variant/5 active:scale-95 transition-transform w-16 h-full">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-caption text-label-caption">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-on-surface-variant/5 active:scale-95 transition-transform w-16 h-full">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">analytics</span>
<span class="font-label-caption text-label-caption">Reports</span>
</button>
</nav>
<!-- Desktop Side/Top Nav placeholder for md breakpoint - instructions say use full nav cluster in TopAppBar -->
<style>
        @media (min-width: 768px) {
            body { padding-bottom: 0; }
        }
    </style>
</body></html>
