<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ROS POS - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed-variant": "#00513e",
                      "tertiary-container": "#885200",
                      "secondary": "#1b6c3d",
                      "outline-variant": "#bec9c3",
                      "on-surface-variant": "#3f4944",
                      "on-surface": "#171d1a",
                      "outline": "#6f7974",
                      "on-primary-fixed": "#002117",
                      "on-primary-container": "#9ae9cb",
                      "surface-container-lowest": "#ffffff",
                      "primary-container": "#156b54",
                      "tertiary-fixed": "#ffdcbb",
                      "on-background": "#171d1a",
                      "inverse-primary": "#88d6b9",
                      "on-tertiary-fixed": "#2b1700",
                      "on-error-container": "#93000a",
                      "error": "#ba1a1a",
                      "error-container": "#ffdad6",
                      "surface-bright": "#f5fbf5",
                      "on-secondary-fixed-variant": "#00522a",
                      "surface-tint": "#156b54",
                      "inverse-on-surface": "#ecf2ed",
                      "tertiary-fixed-dim": "#ffb869",
                      "surface-container-highest": "#dee4df",
                      "surface": "#f5fbf5",
                      "surface-container-high": "#e4eae4",
                      "inverse-surface": "#2c322e",
                      "surface-variant": "#dee4df",
                      "secondary-fixed-dim": "#89d89e",
                      "surface-container": "#e9efea",
                      "tertiary": "#673d00",
                      "on-tertiary-container": "#ffd0a0",
                      "surface-container-low": "#eff5f0",
                      "secondary-fixed": "#a4f4b8",
                      "on-tertiary-fixed-variant": "#673d00",
                      "surface-dim": "#d5dcd6",
                      "secondary-container": "#a4f4b8",
                      "primary-fixed": "#a4f2d5",
                      "on-tertiary": "#ffffff",
                      "background": "#f5fbf5",
                      "on-secondary-container": "#237242",
                      "primary-fixed-dim": "#88d6b9",
                      "primary": "#00513e",
                      "on-primary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "on-error": "#ffffff",
                      "on-secondary-fixed": "#00210d"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "margin-page": "16px",
                      "bottom-action-height": "56px",
                      "touch-target-min": "48px"
              },
              "fontFamily": {
                      "label-caption": [
                              "Roboto"
                      ],
                      "money-display": [
                              "Roboto"
                      ],
                      "display-title": [
                              "Roboto"
                      ],
                      "body-secondary": [
                              "Roboto"
                      ],
                      "section-header": [
                              "Roboto"
                      ],
                      "body-main": [
                              "Roboto"
                      ]
              },
              "fontSize": {
                      "label-caption": [
                              "11px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.5px",
                                      "fontWeight": "500"
                              }
                      ],
                      "money-display": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "500"
                              }
                      ],
                      "display-title": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-secondary": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "section-header": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "500"
                              }
                      ],
                      "body-main": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Smooth transitions for interactive elements */
        .interactive-row {
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }
        .interactive-row:active {
            background-color: rgba(0, 81, 62, 0.08); /* Primary with 8% opacity for pressed state */
        }
        
        /* Hide scrollbar for clean look but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased h-screen flex flex-col font-body-main relative pb-bottom-action-height md:pb-0">
<!-- TopAppBar Semantic Shell -->
<header class="flex items-center justify-between px-gutter w-full h-14 bg-surface top-0 sticky z-50 bg-surface-container">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-xl cursor-pointer hover:opacity-80 active:opacity-80 transition-opacity">storefront</span>
<h1 class="font-display-title text-display-title text-primary font-bold tracking-tight">ROS</h1>
</div>
<div class="flex items-center gap-4">
<button aria-label="Join via QR" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80">
<span class="material-symbols-outlined">qr_code_scanner</span>
</button>
<button aria-label="Sign out" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80">
<span class="material-symbols-outlined">logout</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto no-scrollbar w-full max-w-4xl mx-auto px-margin-page pt-6 pb-24">
<!-- Stall Context Header -->
<section class="mb-8 flex flex-col gap-4">
<!-- Active Stall Dropdown -->
<div class="relative w-full max-w-sm">
<label class="absolute -top-2 left-3 bg-background px-1 font-label-caption text-label-caption text-outline z-10" for="stall-select">Active stall</label>
<select class="w-full h-touch-target-min appearance-none bg-transparent border border-outline rounded-lg px-4 py-3 font-body-main text-body-main text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all shadow-sm" id="stall-select">
<option value="dm-01">The Dosa Man</option>
<option value="dm-02">The Dosa Man (North)</option>
<option value="add-new">+ Add new stall</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
<!-- Stall Identity -->
<div class="mt-4">
<h2 class="font-display-title text-[32px] leading-[40px] font-bold text-on-background mb-1">The Dosa Man</h2>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="bg-primary-container text-on-primary-container font-label-caption text-label-caption px-2 py-0.5 rounded-full uppercase tracking-wider">Owner</span>
<span class="font-body-secondary text-body-secondary">•</span>
<span class="font-body-secondary text-body-secondary font-medium">Stall ID: DM-01</span>
</div>
</div>
</section>
<!-- Navigation Menu List -->
<nav aria-label="Main Navigation" class="flex flex-col gap-gutter">
<!-- Bento-style primary actions row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-2">
<!-- Primary Action: New Order -->
<button class="interactive-row bg-surface-container rounded-xl flex items-center justify-between p-4 min-h-[72px] w-full text-left group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-sm">
<span class="material-symbols-outlined text-on-primary fill">add_circle</span>
</div>
<div>
<h3 class="font-section-header text-section-header text-on-background group-hover:text-primary transition-colors">New order</h3>
<p class="font-label-caption text-label-caption text-on-surface-variant mt-0.5">Start a fresh transaction</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- High Priority: Held Orders -->
<button class="interactive-row bg-surface-container rounded-xl flex items-center justify-between p-4 min-h-[72px] w-full text-left group relative overflow-hidden">
<!-- Subtle amber highlight for held orders context -->
<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-[#8A5300] rounded-l-xl"></div>
<div class="flex items-center gap-4 pl-2">
<div class="w-12 h-12 rounded-full bg-[#FFF0D4] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#8A5300]">pause_circle</span>
</div>
<div>
<h3 class="font-section-header text-section-header text-on-background group-hover:text-primary transition-colors">Held orders</h3>
<div class="flex items-center gap-2 mt-0.5">
<span class="bg-[#FFF0D4] text-[#8A5300] font-label-caption text-[10px] px-1.5 py-0.5 rounded-full font-bold">3 PENDING</span>
</div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
<!-- Standard List Actions -->
<div class="bg-surface-container rounded-xl overflow-hidden flex flex-col">
<button class="interactive-row flex items-center justify-between p-4 min-h-[72px] w-full text-left border-b border-surface-variant group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-dim flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">kitchen</span>
</div>
<span class="font-section-header text-section-header text-on-background">Stall order screen</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<button class="interactive-row flex items-center justify-between p-4 min-h-[72px] w-full text-left border-b border-surface-variant group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-dim flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">inventory_2</span>
</div>
<span class="font-section-header text-section-header text-on-background">Item availability</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<button class="interactive-row flex items-center justify-between p-4 min-h-[72px] w-full text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-dim flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">table_restaurant</span>
</div>
<span class="font-section-header text-section-header text-on-background">Open tables</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
<!-- Analytics / Reporting Group -->
<div class="bg-surface-container rounded-xl overflow-hidden flex flex-col mt-2">
<button class="interactive-row flex items-center justify-between p-4 min-h-[72px] w-full text-left border-b border-surface-variant group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-dim flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">receipt_long</span>
</div>
<span class="font-section-header text-section-header text-on-background">Today's orders</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<button class="interactive-row flex items-center justify-between p-4 min-h-[72px] w-full text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-dim flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">account_balance_wallet</span>
</div>
<span class="font-section-header text-section-header text-on-background">Today's settlement</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</nav>
</main>
<!-- BottomNavBar Semantic Shell (Visible on mobile, hidden on web) -->
<nav class="fixed bottom-0 w-full h-bottom-action-height flex justify-around items-center px-2 bg-surface-container-low dark:bg-surface-container-lowest z-50 md:hidden">
<button aria-label="Register - Active" class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined fill">point_of_sale</span>
<span class="font-label-caption text-label-caption mt-0.5">Register</span>
</button>
<button aria-label="Orders" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl px-4 py-1 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-caption text-label-caption mt-0.5">Orders</span>
</button>
<button aria-label="History" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl px-4 py-1 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">history</span>
<span class="font-label-caption text-label-caption mt-0.5">History</span>
</button>
<button aria-label="Reports" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl px-4 py-1 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-caption text-label-caption mt-0.5">Reports</span>
</button>
</nav>
</body></html>
