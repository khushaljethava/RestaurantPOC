<style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface-dim min-h-screen relative flex flex-col justify-end">
<!-- Scrim Overlay -->
<div class="absolute inset-0 bg-black/40 z-40 transition-opacity duration-300"></div>
<!-- Modal Bottom Sheet -->
<div class="relative z-50 bg-surface-container w-full rounded-t-2xl shadow-xl flex flex-col max-h-[85vh] pb-6 pt-3 px-6">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant/60 rounded-full mx-auto mb-6"></div>
<!-- Header / Amount Due -->
<div class="text-center mb-8 flex flex-col items-center">
<p class="font-body-secondary text-body-secondary text-on-surface-variant mb-1">Amount Due</p>
<h1 class="text-amount-due text-on-surface tracking-tight">₹240.00</h1>
</div>
<!-- Payment Method Tabs -->
<div class="flex gap-3 mb-8">
<button class="flex-1 bg-surface-container-high hover:bg-surface-variant transition-colors text-on-surface rounded-full py-3 px-4 flex items-center justify-center font-section-header text-section-header">
                Full cash
            </button>
<button class="flex-1 bg-primary text-on-primary rounded-full py-3 px-4 flex items-center justify-center font-section-header text-section-header shadow-md">
                Full UPI (QR)
            </button>
<button class="flex-1 bg-surface-container-high hover:bg-surface-variant transition-colors text-on-surface rounded-full py-3 px-4 flex items-center justify-center font-section-header text-section-header border border-outline-variant/50">
                Split
            </button>
</div>
<!-- Content Area: UPI QR View (Active) -->
<div class="flex-1 overflow-y-auto flex flex-col items-center pb-4" id="upi-view">
<!-- QR Code Plate -->
<div class="bg-white p-8 rounded-3xl shadow-sm border border-surface-variant/50 mb-6 w-[280px] h-[280px] flex items-center justify-center">
<img class="w-full h-full object-contain mix-blend-multiply" data-alt="A clean, high-contrast black and white QR code meant for scanning a digital payment, set against a stark white background. The image is a strict 1:1 square, sharp and utilitarian, reflecting a modern transactional POS environment without any extraneous decorative elements or colors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAta37fLUo18rg-41iBef3frz3XOIblRodi75NfVl4CNvWlzZ4bGfgvEYNhq4iELu95IHc0pxTKJfoY-_sZee-rkoG-mGx02ZuD8B12rZ108_2ZPcaRSuNzf1UZRP6_KWUCHF7Mgpgdq4uHqLslRsIr6B8YN50DwBypuH2olkEE4-GWvmH9EEWl0Vjr-IKORdgRFL7N3H95J0G1_eVuFKXTZ67OZTUY_NG504uzwmxBrzb3ODdPjVVE8A"/>
</div>
<div class="text-center mb-6 flex flex-col gap-1">
<p class="font-section-header text-section-header text-on-surface">Payee: ROS Food Court</p>
<p class="font-body-secondary text-body-secondary text-on-surface-variant">VPA: ros@upi</p>
</div>
<div class="bg-surface-container-low/80 px-5 py-4 rounded-xl flex items-center justify-center gap-3 w-full max-w-sm mb-2 border border-surface-variant/30">
<span class="material-symbols-outlined text-on-surface-variant">info</span>
<p class="font-body-secondary text-body-secondary text-on-surface-variant text-center">Ask the customer to scan, then confirm received</p>
</div>
</div>

<!-- Primary Action -->
<div class="mt-auto pt-2 bg-surface-container">
<button class="w-full h-bottom-action-height bg-primary text-on-primary rounded-xl font-section-header text-section-header flex items-center justify-center hover:bg-primary/90 transition-colors shadow-md active:scale-[0.98]">
