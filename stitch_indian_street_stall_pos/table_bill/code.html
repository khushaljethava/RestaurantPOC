<!DOCTYPE html>

<!-- TopAppBar -->
<header class="bg-surface sticky top-0 w-full flex items-center justify-between px-gutter h-14 z-10 border-b border-surface-container-highest">

</button>
<h1 class="font-section-header text-section-header text-primary">Table 4</h1>

</button>
</header>

<main class="flex-grow p-gutter pb-[calc(112px+env(safe-area-inset-bottom))]">

<span class="font-display-title text-[32px] leading-[40px] font-medium text-primary tabular-nums">₹1,240.00</span>
</div>
<!-- Orders List -->
<div class="space-y-6">
<!-- Token Group 1 -->
<div class="bg-surface-container rounded-xl p-4">
<div class="flex justify-between items-center mb-4">

<span class="bg-secondary text-on-secondary px-3 py-1 rounded-full font-label-caption text-label-caption">Ready</span>
</div>
<div class="space-y-4">
<!-- Item -->
<div class="flex items-start justify-between min-h-[56px]">
<div class="flex gap-4 items-start flex-grow">
<span class="font-money-display text-money-display text-on-surface-variant bg-surface-variant rounded-md w-8 h-8 flex items-center justify-center shrink-0">2</span>
<div>
<p class="font-body-main text-body-main text-on-surface">Masala Dosa</p>
<p class="font-body-secondary text-body-secondary text-on-surface-variant">Extra Chutney</p>
</div>
</div>
<span class="font-money-display text-money-display text-on-surface tabular-nums ml-4">₹240.00</span>
</div>
<!-- Item -->
<div class="flex items-start justify-between min-h-[56px]">

<span class="font-money-display text-money-display text-on-surface-variant bg-surface-variant rounded-md w-8 h-8 flex items-center justify-center shrink-0">1</span>
<div>
<p class="font-body-main text-body-main text-on-surface">Filter Coffee</p>
</div>
</div>
<span class="font-money-display text-money-display text-on-surface tabular-nums ml-4">₹60.00</span>
</div>
</div>
</div>
<!-- Token Group 2 -->
<div class="bg-surface-container rounded-xl p-4">
<div class="flex justify-between items-center mb-4">

</div>
<div class="space-y-4">

<div class="flex items-start justify-between min-h-[56px]">
<div class="flex gap-4 items-start flex-grow">
<span class="font-money-display text-money-display text-on-surface-variant bg-surface-variant rounded-md w-8 h-8 flex items-center justify-center shrink-0">1</span>
<div>
<p class="font-body-main text-body-main text-on-surface">Paneer Tikka</p>
</div>
</div>
<span class="font-money-display text-money-display text-on-surface tabular-nums ml-4">₹320.00</span>
</div>
<!-- Item -->
<div class="flex items-start justify-between min-h-[56px]">
<div class="flex gap-4 items-start flex-grow">
<span class="font-money-display text-money-display text-on-surface-variant bg-surface-variant rounded-md w-8 h-8 flex items-center justify-center shrink-0">2</span>
<div>
<p class="font-body-main text-body-main text-on-surface">Butter Naan</p>
</div>
</div>
<span class="font-money-display text-money-display text-on-surface tabular-nums ml-4">₹120.00</span>
</div>
<!-- Item -->
<div class="flex items-start justify-between min-h-[56px]">
<div class="flex gap-4 items-start flex-grow">
<span class="font-money-display text-money-display text-on-surface-variant bg-surface-variant rounded-md w-8 h-8 flex items-center justify-center shrink-0">1</span>
<div>
<p class="font-body-main text-body-main text-on-surface">Dal Makhani</p>
</div>
</div>
<span class="font-money-display text-money-display text-on-surface tabular-nums ml-4">₹500.00</span>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-container-highest p-4 pb-[max(16px,env(safe-area-inset-bottom))] z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex gap-4 max-w-3xl mx-auto">
<button class="flex-1 h-bottom-action-height rounded-lg border-2 border-outline text-on-surface font-section-header text-section-header flex items-center justify-center active:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined mr-2">add</span>
                Add Items
            </button>
<button class="flex-1 h-bottom-action-height rounded-lg bg-primary text-on-primary font-section-header text-section-header flex items-center justify-center active:bg-primary/90 transition-colors">
<span class="material-symbols-outlined mr-2">payments</span>
