<body class="h-full bg-background text-on-background font-body-md text-body-md antialiased flex items-center justify-center p-page-padding">

<h1 class="font-headline-lg text-headline-lg font-black text-on-surface mb-2">Point-of-Sale Admin</h1>
<p class="text-on-surface-variant">Setup your environment</p>
</div>
<!-- Onboarding Card -->
<div class="bg-surface rounded-xl p-8 shadow-sm border border-border">
<h2 class="font-headline-lg text-headline-lg mb-6 text-on-surface">Name your stall</h2>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="stall-name">Stall Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="storefront">storefront</span>
</div>
<input autofocus="" class="block w-full h-[44px] pl-10 pr-3 py-2 border border-border rounded-lg bg-surface-container-lowest text-on-surface placeholder-outline-variant focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2 focus:ring-offset-background focus:border-transparent transition-shadow font-body-md text-body-md" id="stall-name" name="stall-name" placeholder="e.g. Spice Route Express" required="" type="text"/>
</div>
</div>
<div class="flex items-start bg-secondary-container/30 p-4 rounded-lg">
<span class="material-symbols-outlined text-secondary mr-3 mt-0.5" data-icon="info">info</span>
<p class="font-table-cell text-table-cell text-on-surface-variant">
                        This creates the primary stall for your account. You can rename it later or add more stalls from the dashboard once setup is complete.
                    </p>
</div>
<div class="pt-4">
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm font-header-md text-header-md text-on-primary bg-[#156B54] hover:bg-primary hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-surface-tint focus:ring-offset-background transition-colors h-[44px] items-center" type="submit">

                    </button>
</div>
</form>
