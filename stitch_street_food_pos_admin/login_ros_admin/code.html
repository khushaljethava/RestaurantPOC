<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StreetStall POS - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#3b0906",
                    "border": "#BFC9C3",
                    "primary-container": "#A4F2D5",
                    "outline": "#6f7974",
                    "tertiary-fixed-dim": "#ffb4aa",
                    "primary": "#00513e",
                    "on-surface": "#181c1a",
                    "tertiary-fixed": "#ffdad5",
                    "surface-dim": "#d7dbd7",
                    "inverse-on-surface": "#eef2ee",
                    "error-container": "#ffdad6",
                    "surface-container-highest": "#e0e3e0",
                    "warning-container": "#FFF0D4",
                    "on-error": "#ffffff",
                    "primary-fixed": "#a4f2d5",
                    "surface-tint": "#156b54",
                    "outline-variant": "#bec9c3",
                    "on-secondary-fixed-variant": "#3f4944",
                    "on-background": "#181c1a",
                    "on-tertiary-container": "#ffcdc6",
                    "surface-container": "#ebefeb",
                    "on-primary-fixed": "#002117",
                    "surface-bright": "#f7faf6",
                    "secondary": "#56615b",
                    "inverse-surface": "#2d312f",
                    "primary-fixed-dim": "#88d6b9",
                    "warning": "#8A5300",
                    "surface-container-low": "#f1f4f1",
                    "tertiary": "#73332c",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#dae5de",
                    "surface-container-high": "#e6e9e5",
                    "secondary-container": "#dae5de",
                    "error": "#BA1A1A",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "inverse-primary": "#88d6b9",
                    "on-surface-variant": "#3f4944",
                    "success": "#1B6C3D",
                    "on-secondary-container": "#5c6761",
                    "on-secondary": "#ffffff",
                    "on-tertiary-fixed-variant": "#73332c",
                    "on-secondary-fixed": "#141e19",
                    "tertiary-container": "#904a42",
                    "on-primary-container": "#9ae9cb",
                    "surface": "#E9EFEB",
                    "on-primary-fixed-variant": "#00513e",
                    "secondary-fixed-dim": "#bec9c2",
                    "surface-variant": "#e0e3e0",
                    "background": "#F5FBF6",
                    "on-tertiary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "page-padding": "32px",
                    "sidebar-width": "224px",
                    "table-row-height": "44px",
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Roboto"],
                    "header-md": ["Roboto"],
                    "currency-display": ["Roboto"],
                    "body-md": ["Roboto"],
                    "table-cell": ["Roboto"],
                    "label-sm": ["Roboto"]
            },
            "fontSize": {
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],
                    "header-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "currency-display": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "table-cell": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Login Card -->
<main class="w-full max-w-[400px] bg-surface rounded-xl border border-border p-8 flex flex-col gap-8">
<!-- Header -->
<header class="text-center flex flex-col gap-2">
<div class="flex items-center justify-center gap-3 mb-2">
<span class="material-symbols-outlined text-[32px] text-surface-tint" style="font-variation-settings: 'FILL' 1;">
                    storefront
                </span>
<h1 class="font-headline-lg text-headline-lg font-black text-on-surface">StreetStall POS</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your stall</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">
                        mail
                    </span>
<input class="w-full h-table-row-height pl-10 pr-4 bg-surface-container-lowest border border-border rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2 focus:ring-offset-surface transition-all" id="email" name="email" placeholder="admin@streetstall.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-surface-tint hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2 focus:ring-offset-surface rounded" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">
                        lock
                    </span>
<input class="w-full h-table-row-height pl-10 pr-10 bg-surface-container-lowest border border-border rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2 focus:ring-offset-surface transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant focus:outline-none focus:text-surface-tint" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<button class="w-full h-table-row-height mt-2 bg-surface-tint hover:bg-primary text-on-primary font-header-md text-header-md rounded-lg transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2 focus:ring-offset-surface" type="submit">
                Sign in
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Toggle -->
<footer class="text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="font-header-md text-header-md text-surface-tint hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2 focus:ring-offset-surface rounded px-1" href="#">Sign up</a>
</footer>
</main>
</body></html>
